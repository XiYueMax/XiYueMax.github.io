name: Deploy Unified Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm install

      - name: Build VitePress Docs
        run: npm run docs:build

      - name: Prepare Unified Dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp avatar.png dist/ 2>/dev/null || true
          cp logo.png dist/ 2>/dev/null || true
          mkdir -p dist/SiyoX-Docs
          cp -r docs/.vitepress/dist/* dist/SiyoX-Docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
